# 每次 push / PR 跑类型检查和单元测试。
# 不打包 —— 打包慢，且只在发版时才需要。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      # v7 跑在 Node 24 上。v4 系列还是 Node 20，GitHub 已经在弃用，
      # 每次跑都会刷一条 deprecation 警告（只是警告，不影响结果）
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
