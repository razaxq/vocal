name: release
on:
  push:
    tags: ['v*']
  # Manual runs create downloadable artifacts without publishing a release.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a stable x.y.z version' }
          if ($env:IS_TAG -eq 'true' -and $env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package.json ($version)"
          }
  build:
    needs: version
    uses: ./.github/workflows/native-build.yml
    with:
      release: true
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: vocal-native-windows-x64
          path: data/native-release
      - name: Publish verified Qt packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./native/scripts/publish.ps1 -Tag $env:RELEASE_TAG -Repository $env:RELEASE_REPOSITORY -ArtifactDirectory data/native-release
