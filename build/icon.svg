<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="blue" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#3A8CFF"/>
      <stop offset="52%" stop-color="#246EEB"/>
      <stop offset="100%" stop-color="#123FCA"/>
    </linearGradient>
    <linearGradient id="blue2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3387FA"/>
      <stop offset="58%" stop-color="#2268E3"/>
      <stop offset="100%" stop-color="#123FC5"/>
    </linearGradient>
  </defs>

  <!-- Transparent background -->

  <!-- 文: slightly thicker strokes -->

  <!-- right descending stroke -->
  <path d="M 651 338
           C 646 432, 615 515, 558 585
           C 498 659, 414 717, 287 778"
        fill="none"
        stroke="url(#blue2)"
        stroke-width="98"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- left-to-right sweeping stroke -->
  <path d="M 362 430
           C 420 526, 489 608, 575 669
           C 646 720, 724 751, 812 775"
        fill="none"
        stroke="url(#blue)"
        stroke-width="98"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- top vertical cap -->
  <rect x="473" y="134" width="102" height="166" rx="51" fill="url(#blue)"/>

  <!-- top horizontal stroke, rendered last so it always stays visible -->
  <rect x="220" y="240" width="570" height="112" rx="56" fill="url(#blue)"/>

  <!-- waveform unchanged -->
  <rect x="738" y="430" width="46" height="112" rx="23" fill="url(#blue)"/>
  <rect x="808" y="388" width="46" height="196" rx="23" fill="url(#blue)"/>
  <rect x="878" y="430" width="46" height="112" rx="23" fill="url(#blue)"/>
</svg>
